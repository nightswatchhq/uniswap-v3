[table.token0_decimals]
description = "`decimals()` on each new pool's `token0`, called once per `factory__pool_created` row and pinned at that row's block. `result` is a single 32-byte word whose last byte is the value; the `token_metadata` view decodes it."
grain = "one row per PoolCreated, keyed by the token0 address in the implicit `address` column"

[table.token0_decimals.columns]
calldata = "The exact calldata sent, including the 4-byte selector - the question this row answers."
content_address = "Content address of the (chain, block, contract, calldata) tuple: the same question at the same block always has this key, so two operators re-executing agree byte for byte."
result = "Raw ABI return bytes, lowercase 0x. Decode it in a view rather than at read time; `token_metadata` does."
reverted = "The `reverted` bool parameter - stored as exact text `'true'`/`'false'`, not a SQL boolean. `reverted = true` and `AND`/`NOT` implicitly cast and work; `COALESCE`, `CASE`, `bool_and`/`bool_or` and `UNION` do not. Write `reverted = 'true'` or `CAST(reverted AS BOOLEAN)`. (seeded from the ABI - edit semantic.toml to improve this)"

[table.token0_decimals.footguns]
bools = ["reverted"]

